<!DOCTYPE html>
<html lang="zh-Hans">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
	<meta name="description" content="见缝插针 - 傻瓜模式">
	<title>见缝插针 · 傻瓜模式</title>
	<style>
		:root {
			--bg: #c8c8c8;
			--ink: #1c1c1c;
			--muted: #5e5e5e;
			--accent: #e74c3c;
			--accent-dark: #c0392b;
			--panel: rgba(255, 255, 255, 0.62);
			--line: rgba(0, 0, 0, 0.12);
		}
		* { box-sizing: border-box; }
		html, body {
			margin: 0;
			padding: 0;
			min-height: 100%;
			background: var(--bg);
			color: var(--ink);
			font-family: "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
			-webkit-tap-highlight-color: transparent;
			touch-action: manipulation;
		}
		/* 切勿在样式表里写 #stage { display:none } */
		#stage {
			position: fixed;
			left: 0;
			top: 0;
			z-index: 1;
		}
		#begin {
			position: fixed;
			inset: 0;
			z-index: 2;
			display: flex;
			align-items: center;
			justify-content: center;
			padding:
				max(24px, env(safe-area-inset-top))
				max(16px, env(safe-area-inset-right))
				max(24px, env(safe-area-inset-bottom))
				max(16px, env(safe-area-inset-left));
			background:
				radial-gradient(circle at 18% 22%, rgba(255,220,220,0.55) 0 2px, transparent 3px),
				radial-gradient(circle at 78% 18%, rgba(255,255,255,0.45) 0 2px, transparent 3px),
				radial-gradient(circle at 64% 72%, rgba(0,0,0,0.08) 0 2px, transparent 3px),
				radial-gradient(circle at 28% 78%, rgba(0,0,0,0.07) 0 2px, transparent 3px),
				radial-gradient(560px 340px at 50% 12%, rgba(255, 210, 210, 0.45) 0%, transparent 68%),
				var(--bg);
			background-size: 120px 120px, 140px 140px, 160px 160px, 130px 130px, auto, auto;
		}
		.center-box {
			width: min(360px, 100%);
			text-align: center;
			animation: rise 0.28s ease-out both;
		}
		@keyframes rise {
			from { opacity: 0; transform: translateY(8px); }
			to { opacity: 1; transform: translateY(0); }
		}
		.badge {
			display: inline-block;
			margin-bottom: 10px;
			padding: 4px 11px;
			border-radius: 999px;
			border: 1px solid var(--line);
			background: var(--panel);
			color: var(--muted);
			font-size: 0.72rem;
			letter-spacing: 0.05em;
		}
		.title {
			margin: 0 0 6px;
			font-size: clamp(2rem, 9vw, 2.55rem);
			font-weight: 800;
			letter-spacing: 0.1em;
			line-height: 1.1;
		}
		.title .hl { color: var(--accent); }
		.sub {
			margin: 0 0 14px;
			color: var(--muted);
			font-size: 0.86rem;
			line-height: 1.45;
		}
		.modes {
			display: flex;
			gap: 6px;
			justify-content: center;
			margin-bottom: 14px;
			padding: 3px;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.35);
			border: 1px solid var(--line);
		}
		.modes a {
			flex: 1;
			max-width: 150px;
			padding: 8px 10px;
			border-radius: 999px;
			border: 0;
			text-decoration: none;
			font-size: 0.85rem;
			color: var(--muted);
			background: transparent;
			transition: background 0.12s ease, color 0.12s ease;
		}
		.modes a.on {
			color: #fff;
			background: var(--accent);
			font-weight: 600;
		}
		.button {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			width: min(168px, 70%);
			min-height: 100px;
			margin: 0 auto 12px;
			padding: 14px;
			border: 0;
			border-radius: 18px;
			background: linear-gradient(165deg, #f07878 0%, var(--accent) 52%, var(--accent-dark) 100%);
			color: #fff;
			box-shadow: 0 8px 20px rgba(231, 76, 60, 0.28);
			cursor: pointer;
			user-select: none;
			transition: transform 0.1s ease;
		}
		.button:active { transform: scale(0.97); }
		#txtAr {
			font-size: clamp(1.9rem, 8vw, 2.5rem);
			font-weight: 800;
			line-height: 1.05;
			letter-spacing: 0.06em;
		}
		.button .text {
			margin-top: 8px;
			font-size: 0.86rem;
			opacity: 0.95;
		}
		.lee_button1,
		.lee_button3,
		#btnFW,
		#btnGuanzhu,
		#wxArrow { display: none !important; }
		.lee_button2,
		#rehovertree {
			appearance: none;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-height: 44px;
			min-width: 168px;
			margin: 0 auto;
			padding: 8px 16px;
			border-radius: 12px;
			border: 1px solid var(--line);
			background: var(--panel);
			color: var(--ink);
			font: inherit;
			font-size: 0.95rem;
			text-decoration: none;
			cursor: pointer;
			position: static;
			width: auto;
			height: auto;
			left: auto;
			top: auto;
			line-height: normal;
			backdrop-filter: blur(6px);
		}
		#lvnew {
			display: none;
			margin: 16px auto 0;
			padding: 14px;
			max-width: 280px;
			border-radius: 14px;
			border: 1px solid var(--line);
			background: rgba(255, 255, 255, 0.92);
			color: var(--muted);
			font-size: 0.9rem;
			position: static;
			left: auto;
			top: auto;
			animation: rise 0.25s ease-out both;
		}
		#lvnew .confirm-row {
			display: flex;
			gap: 10px;
			justify-content: center;
			margin-top: 12px;
		}
		#lvnew .confirm-row span,
		#lvnew .confirm-row a {
			min-width: 84px;
			min-height: 38px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			border-radius: 10px;
			border: 1px solid var(--line);
			cursor: pointer;
			color: var(--ink);
			text-decoration: none;
			background: transparent;
		}
		#btnReset {
			background: var(--accent) !important;
			border-color: var(--accent) !important;
			color: #fff !important;
		}
		#tip {
			display: none;
			margin-top: 10px;
			color: #2e7d4f;
			font-size: 0.85rem;
		}
		.foot {
			margin-top: 22px;
			font-size: 0.7rem;
			color: var(--muted);
			letter-spacing: 0.04em;
		}
		.opts {
			margin: 0 auto 12px;
			padding: 10px 12px;
			max-width: 280px;
			border-radius: 12px;
			border: 1px solid var(--line);
			background: var(--panel);
			text-align: left;
		}
		.opts label {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
			font-size: 0.84rem;
			color: var(--ink);
			cursor: pointer;
			user-select: none;
		}
		.opts label + label { margin-top: 10px; }
		.opts input[type="checkbox"] {
			width: 15px;
			height: 15px;
			accent-color: var(--accent);
		}
		.opts input[type="range"] {
			width: 110px;
			accent-color: var(--accent);
		}
		.needle-ctrl {
			display: inline-flex;
			align-items: center;
			gap: 4px;
		}
		.needle-ctrl button {
			appearance: none;
			width: 28px;
			height: 28px;
			border-radius: 7px;
			border: 1px solid var(--line);
			background: #fff;
			color: var(--ink);
			font: inherit;
			font-size: 1rem;
			line-height: 1;
			cursor: pointer;
		}
		.needle-ctrl input {
			width: 64px;
			height: 28px;
			border-radius: 7px;
			border: 1px solid var(--line);
			text-align: center;
			font: inherit;
			font-size: 0.9rem;
			background: #fff;
		}
		.opts .hint {
			margin: 8px 0 0;
			font-size: 0.72rem;
			color: var(--muted);
			line-height: 1.35;
		}
		#sensVal { min-width: 1.2em; text-align: right; font-variant-numeric: tabular-nums; }
	</style>
</head>
<body>
	<canvas id="stage" style="display:none;"></canvas>
	<div id="begin">
		<section class="center-box">
			<span class="badge">傻瓜模式</span>
			<h1 class="title">见缝<span class="hl">插针</span></h1>
			<p class="sub">更轻松。Esc 回菜单。</p>
			<div class="modes">
				<a href="jfcz.html">常规</a>
				<a class="on" href="happyMode.html">傻瓜模式</a>
			</div>
			<div class="opts" data-capture="1">
				<label data-capture="1">
					<span data-capture="1">滚轮插针</span>
					<input type="checkbox" id="optWheel" data-capture="1">
				</label>
				<label data-capture="1">
					<span data-capture="1">滚轮灵敏度 <b id="sensVal">8</b></span>
					<input type="range" id="optSens" min="1" max="10" step="1" value="8" data-capture="1">
				</label>
				<label data-capture="1">
					<span data-capture="1">每关针数</span>
					<span class="needle-ctrl" data-capture="1">
						<button type="button" id="needleMinus" data-capture="1" aria-label="减少">−</button>
						<input type="number" id="needleCount" min="0" step="1" value="0" data-capture="1">
						<button type="button" id="needlePlus" data-capture="1" aria-label="增加">+</button>
					</span>
				</label>
				<p class="hint">灵敏 1 = 一格一针；拉高可高速叠针。针数 0 = 默认。</p>
			</div>
			<div class="button" data-capture="1">
				<div id="txtAr" data-capture="1"></div>
				<div class="text" data-capture="1"></div>
			</div>
			<a id="rehovertree" class="lee_button2" href="javascript:void(0)" data-capture="1">重头再来</a>
			<span name="btnFW" class="lee_button1" id="btnFW"></span>
			<span class="lee_button3" id="btnGuanzhu"></span>
			<div id="lvnew">
				<div>确定从第 1 关重新开始？当前进度会清掉。</div>
				<div class="confirm-row">
					<span id="btnReset" data-capture="1">确定</span>
					<a href="javascript:void(0)" id="cancelhovertree" data-capture="1">取消</a>
				</div>
				<div id="tip"></div>
			</div>
			<div class="foot">原作 · 何问起</div>
		</section>
		<section id="wxArrow"></section>
	</div>
	<script src="happy.js"></script>
	<script>
	(function () {
		var lv = document.getElementById("lvnew");
		var restart = document.getElementById("rehovertree");
		var cancel = document.getElementById("cancelhovertree");
		var reset = document.getElementById("btnReset");
		var wheel = document.getElementById("optWheel");
		var sens = document.getElementById("optSens");
		var sensVal = document.getElementById("sensVal");
		var needles = document.getElementById("needleCount");
		var minus = document.getElementById("needleMinus");
		var plus = document.getElementById("needlePlus");
		var KEY_W = "jfcz-wheel";
		var KEY_S = "jfcz-happy-wheel-sens";
		var KEY_N = "jfcz-happy-needles";

		function hide() { lv.style.display = "none"; }
		function show() { lv.style.display = "block"; }
		function clamp(n) {
			n = parseInt(n, 10);
			if (isNaN(n) || n < 0) n = 0;
			return n;
		}
		function saveNeedles() {
			var n = clamp(needles.value);
			needles.value = n;
			try { localStorage.setItem(KEY_N, String(n)); } catch (e) {}
		}
		function saveWheel() {
			try {
				localStorage.setItem(KEY_W, wheel.checked ? "1" : "0");
				localStorage.setItem("jfcz-happy-wheel", wheel.checked ? "1" : "0");
			} catch (e) {}
		}
		function syncSens() {
			sensVal.textContent = sens.value;
			try { localStorage.setItem(KEY_S, sens.value); } catch (e) {}
		}

		try {
			wheel.checked = localStorage.getItem(KEY_W) === "1" || localStorage.getItem("jfcz-happy-wheel") === "1";
			sens.value = Math.min(10, Math.max(1, +(localStorage.getItem(KEY_S) || localStorage.getItem("jfcz-wheel-sens") || 8)));
			sensVal.textContent = sens.value;
			needles.value = clamp(localStorage.getItem(KEY_N) || 0);
		} catch (e) {}

		wheel.addEventListener("change", saveWheel);
		sens.addEventListener("input", syncSens);
		needles.addEventListener("change", saveNeedles);
		needles.addEventListener("blur", saveNeedles);
		minus.addEventListener("click", function () {
			needles.value = clamp(+needles.value - 1);
			saveNeedles();
		});
		plus.addEventListener("click", function () {
			needles.value = clamp(+needles.value + 1);
			saveNeedles();
		});

		if (restart) restart.addEventListener("click", function (e) { e.preventDefault(); show(); });
		if (cancel) cancel.addEventListener("click", function (e) { e.preventDefault(); hide(); });
		if (reset) reset.addEventListener("click", hide);
	})();
	</script>
</body>
</html>
