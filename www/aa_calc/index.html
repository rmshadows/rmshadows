<!DOCTYPE html>
<html lang="zh-Hans">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>AA Cost Calculator</title>
	<meta name="description" content="AA 分账计算器">
	<style>
		:root {
			--bg: #f6f4f1;
			--card: #fff;
			--ink: #1c1b19;
			--muted: #6b6560;
			--line: #e4dfd8;
			--accent: #2a6f6a;
			--accent-soft: #e6f2f1;
			--danger: #b54a3c;
			--warn: #c47b2c;
			--radius: 10px;
			--shadow: 0 1px 2px rgba(28, 27, 25, 0.06);
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			padding: 20px 16px 48px;
			font: 15px/1.5 "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
			color: var(--ink);
			background:
				radial-gradient(900px 420px at 10% -10%, #e8f0ef 0%, transparent 55%),
				radial-gradient(700px 380px at 100% 0%, #f3ebe3 0%, transparent 50%),
				var(--bg);
		}
		.page { max-width: 720px; margin: 0 auto; }
		h1 {
			margin: 0 0 4px;
			font-size: 1.55rem;
			font-weight: 700;
			letter-spacing: 0.02em;
		}
		.sub { margin: 0 0 18px; color: var(--muted); font-size: 0.9rem; }
		.card {
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: var(--radius);
			box-shadow: var(--shadow);
			padding: 16px;
			margin-bottom: 14px;
		}
		.card h2 {
			margin: 0 0 12px;
			font-size: 1rem;
			border-bottom: 1px dashed var(--line);
			padding-bottom: 8px;
		}
		.help {
			margin: 0;
			padding-left: 1.2em;
			color: var(--muted);
			font-size: 0.88rem;
		}
		.help li { margin: 0 0 6px; }
		.row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
		button {
			appearance: none;
			border: 1px solid var(--line);
			background: var(--accent-soft);
			color: var(--accent);
			border-radius: 8px;
			padding: 8px 12px;
			font: inherit;
			cursor: pointer;
		}
		button:hover { filter: brightness(0.98); }
		button.primary {
			background: var(--accent);
			border-color: var(--accent);
			color: #fff;
		}
		button.ghost {
			background: transparent;
			color: var(--danger);
			border-color: transparent;
			text-decoration: underline;
			padding-left: 4px;
			padding-right: 4px;
		}
		button.ghost.warn { color: var(--warn); }
		table {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.92rem;
		}
		th, td {
			padding: 8px 6px;
			border-bottom: 1px solid var(--line);
			vertical-align: middle;
			text-align: left;
		}
		th { color: var(--muted); font-weight: 600; font-size: 0.8rem; }
		td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
		input[type="text"] {
			width: 100%;
			min-width: 0;
			border: 1px solid var(--line);
			border-radius: 6px;
			padding: 7px 8px;
			font: inherit;
			background: #fff;
		}
		input[type="text"]:focus {
			outline: 2px solid color-mix(in srgb, var(--accent) 35%, white);
			border-color: var(--accent);
		}
		input[type="checkbox"] {
			width: 18px;
			height: 18px;
			accent-color: var(--accent);
		}
		.share-cells { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 8px; }
		.share-cells label {
			display: inline-flex;
			align-items: center;
			gap: 4px;
			font-size: 0.85rem;
			color: var(--muted);
			white-space: nowrap;
		}
		.dish {
			margin-bottom: 12px;
			padding-bottom: 10px;
			border-bottom: 1px solid var(--line);
		}
		.dish-top {
			display: flex;
			gap: 8px;
			align-items: center;
			flex-wrap: wrap;
		}
		.dish-top input[data-price] { flex: 1; min-width: 120px; }
		.meta {
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
			align-items: center;
			margin-top: 12px;
			padding: 10px;
			border: 1px dashed var(--line);
			border-radius: 8px;
		}
		.meta label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
		.meta input { width: 88px; }
		.totals {
			display: grid;
			gap: 8px;
			margin: 12px 0;
			font-variant-numeric: tabular-nums;
		}
		.totals strong { font-size: 1.15rem; }
		.diff-pos { color: var(--danger); }
		.diff-neg { color: var(--accent); }
		.hint { color: var(--muted); font-size: 0.8rem; }
		.empty { color: var(--muted); font-size: 0.9rem; padding: 8px 0; }
		.tax-label {
			display: inline-flex;
			align-items: center;
			gap: 4px;
			font-size: 0.85rem;
			color: var(--muted);
		}
	</style>
</head>
<body>
	<div class="page">
		<h1>AA Cost Calculator</h1>
		<p class="sub">本地分账 · 数据只存在本机浏览器</p>

		<section class="card">
			<h2>使用说明</h2>
			<ol class="help">
				<li>先在「参与者」里加人并填名字；</li>
				<li>在「账单」里加每一项金额（支持 <code>20+18.5</code>）；</li>
				<li>勾选分摊的人（不勾 = 所有人平分该项）；</li>
				<li>勾「含倍率」的项会乘下面的折扣/税（服务费 15% 填 <code>1.15</code>，八折填 <code>0.8</code>）；</li>
				<li>「已付」填每人垫付，右侧「结算」为还应给 / 应收回。</li>
			</ol>
		</section>

		<section class="card">
			<h2>参与者</h2>
			<table>
				<thead>
					<tr>
						<th>名字</th>
						<th class="num">应付</th>
						<th class="num">已付</th>
						<th class="num">结算</th>
						<th></th>
					</tr>
				</thead>
				<tbody id="people-body"></tbody>
			</table>
			<div class="row-actions">
				<button type="button" class="primary" id="btn-add-person">+ 加人</button>
			</div>
		</section>

		<section class="card">
			<h2>账单</h2>
			<div id="dishes-list"></div>
			<div class="row-actions">
				<button type="button" class="primary" id="btn-add-dish">+ 加一项</button>
			</div>
			<div class="meta">
				<label>折扣 / 税倍率
					<input type="text" id="tax" inputmode="decimal" value="1" autocomplete="off">
				</label>
				<span class="hint">仅作用于勾了「含倍率」的项；默认 1</span>
			</div>
		</section>

		<section class="card">
			<h2>结账</h2>
			<div class="totals">
				<div>账单合计 <strong id="grand-total">$0.0</strong></div>
				<label>实付总额
					<input type="text" id="real-pay" inputmode="decimal" placeholder="可选，核对找零" autocomplete="off" style="width:140px;display:inline-block;margin-left:8px">
					<span id="diff" class="hint"></span>
				</label>
			</div>
			<div class="row-actions">
				<button type="button" class="ghost warn" id="btn-checkout">Checkout（清账单，保留余额）</button>
				<button type="button" class="ghost" id="btn-reset-balance">Reset balance</button>
				<button type="button" class="ghost" id="btn-reset-all">Reset all</button>
			</div>
		</section>
	</div>

	<script>
(function () {
	'use strict';

	var STORAGE_KEY = 'aa_calc_v2';

	function toNum(raw) {
		var s = String(raw == null ? '' : raw).trim();
		if (!s) return NaN;
		if (!/^[\d+\-*/().\s]+$/.test(s)) return NaN;
		try {
			var n = Function('"use strict"; return (' + s + ');')();
			return typeof n === 'number' && isFinite(n) ? n : NaN;
		} catch (e) {
			return NaN;
		}
	}

	function money(n) {
		if (!isFinite(n)) n = 0;
		return (Math.round(n * 10) / 10).toFixed(1);
	}

	function withSymbol(n) {
		if (n < 0) return '取回$' + money(-n);
		return '$' + money(n);
	}

	function withNega(n) {
		if (n < 0) return '-$' + money(-n);
		return '+$' + money(n);
	}

	function uid() {
		return 'id_' + Math.random().toString(36).slice(2, 9);
	}

	function escapeAttr(s) {
		return String(s == null ? '' : s)
			.replace(/&/g, '&amp;')
			.replace(/"/g, '&quot;')
			.replace(/</g, '&lt;');
	}

	function escapeHtml(s) {
		return String(s == null ? '' : s)
			.replace(/&/g, '&amp;')
			.replace(/</g, '&lt;')
			.replace(/>/g, '&gt;');
	}

	var state = {
		people: [],
		dishes: [],
		tax: '1',
		realPay: ''
	};

	function defaultState() {
		return {
			people: [
				{ id: uid(), name: 'User1', paid: '' },
				{ id: uid(), name: 'User2', paid: '' }
			],
			dishes: [
				{ id: uid(), price: '', tax: true, share: [] }
			],
			tax: '1',
			realPay: ''
		};
	}

	function migrateLegacy() {
		var s = defaultState();
		try {
			var names = JSON.parse(localStorage.persons || '[]');
			if (names.length) {
				s.people = names.map(function (n) {
					return { id: uid(), name: String(n || ''), paid: '' };
				});
			}
			var details = JSON.parse(localStorage.details || '{}');
			if (details.tax != null) s.tax = String(details.tax);
			if (Array.isArray(details.dishes)) {
				s.dishes = [];
				details.dishes.forEach(function (d) {
					if (!d || d.price == null) return;
					var share = [];
					(d.persons || []).forEach(function (paxIdx) {
						var idx = Number(paxIdx) - 1;
						if (s.people[idx]) share.push(s.people[idx].id);
					});
					s.dishes.push({
						id: uid(),
						price: String(d.price),
						tax: !!d.with_tax,
						share: share
					});
				});
				if (!s.dishes.length) s.dishes = defaultState().dishes;
			}
			if (Array.isArray(details.paid)) {
				details.paid.forEach(function (p, i) {
					if (i >= 1 && s.people[i - 1] && p != null && p !== '') {
						s.people[i - 1].paid = String(p);
					}
				});
			}
		} catch (e) { /* ignore */ }
		return s;
	}

	function load() {
		try {
			var raw = localStorage.getItem(STORAGE_KEY);
			if (!raw) {
				if (localStorage.persons || localStorage.details) {
					state = migrateLegacy();
					save();
					return;
				}
				state = defaultState();
				return;
			}
			var data = JSON.parse(raw);
			if (!data.people || !data.people.length) data = defaultState();
			state = data;
		} catch (e) {
			state = defaultState();
		}
	}

	function save() {
		try {
			localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
		} catch (e) { /* quota */ }
	}

	function activePeople() {
		return state.people.filter(function (p) {
			return String(p.name || '').trim() !== '';
		});
	}

	function calc() {
		var tax = toNum(state.tax);
		if (!isFinite(tax)) tax = 1;

		var people = activePeople();
		var due = {};
		people.forEach(function (p) { due[p.id] = 0; });

		var dishMeta = {};
		var total = 0;

		state.dishes.forEach(function (d) {
			var price = toNum(d.price);
			if (!isFinite(price)) price = 0;
			var amt = d.tax ? price * tax : price;
			total += amt;

			var shareIds = (d.share || []).filter(function (id) {
				return people.some(function (p) { return p.id === id; });
			});
			if (!shareIds.length) shareIds = people.map(function (p) { return p.id; });
			var each = shareIds.length ? amt / shareIds.length : 0;
			shareIds.forEach(function (id) { due[id] += each; });
			dishMeta[d.id] = { each: each, n: shareIds.length };
		});

		return { due: due, total: total, dishMeta: dishMeta };
	}

	function findPerson(id) {
		return state.people.find(function (p) { return p.id === id; });
	}
	function findDish(id) {
		return state.dishes.find(function (d) { return d.id === id; });
	}

	function buildPeople() {
		var pbody = document.getElementById('people-body');
		pbody.innerHTML = '';
		state.people.forEach(function (p) {
			var tr = document.createElement('tr');
			tr.dataset.pid = p.id;
			tr.innerHTML =
				'<td><input type="text" data-k="name" value="' + escapeAttr(p.name) + '" placeholder="名字" autocomplete="off"></td>' +
				'<td class="num" data-due>—</td>' +
				'<td><input type="text" data-k="paid" value="' + escapeAttr(p.paid) + '" inputmode="decimal" placeholder="0" autocomplete="off"></td>' +
				'<td class="num" data-bal>—</td>' +
				'<td><button type="button" class="ghost" data-del-person>删</button></td>';
			pbody.appendChild(tr);
		});
	}

	function buildDishes() {
		var list = document.getElementById('dishes-list');
		var active = activePeople();
		list.innerHTML = '';
		if (!state.dishes.length) {
			list.innerHTML = '<p class="empty">还没有账单项</p>';
			return;
		}
		state.dishes.forEach(function (d, idx) {
			var wrap = document.createElement('div');
			wrap.className = 'dish';
			wrap.dataset.did = d.id;

			var shareHtml = active.map(function (p) {
				var checked = (d.share || []).indexOf(p.id) !== -1 ? ' checked' : '';
				return '<label><input type="checkbox" data-share data-pid="' + p.id + '"' + checked + '> ' +
					escapeHtml(p.name) + '</label>';
			}).join('');

			wrap.innerHTML =
				'<div class="dish-top">' +
					'<strong>#' + (idx + 1) + '</strong>' +
					'<label class="tax-label"><input type="checkbox" data-tax' + (d.tax ? ' checked' : '') + '> 含倍率</label>' +
					'<input type="text" data-price value="' + escapeAttr(d.price) + '" inputmode="decimal" placeholder="金额，如 38.5 或 20+18.5" autocomplete="off">' +
					'<span class="hint" data-each></span>' +
					'<button type="button" class="ghost" data-del-dish>删</button>' +
				'</div>' +
				'<div class="share-cells">' +
					(shareHtml || '<span class="hint">先填写参与者名字</span>') +
					(active.length ? '<span class="hint">（不勾选 = 全员平分）</span>' : '') +
				'</div>';
			list.appendChild(wrap);
		});
	}

	function refreshShareLabels() {
		// rebuild dishes when names change so checkboxes stay labeled
		buildDishes();
	}

	function updateTotals() {
		var result = calc();

		state.people.forEach(function (p) {
			var tr = document.querySelector('#people-body tr[data-pid="' + p.id + '"]');
			if (!tr) return;
			var named = String(p.name || '').trim() !== '';
			var due = result.due[p.id] || 0;
			var paid = toNum(p.paid);
			if (!isFinite(paid)) paid = 0;
			tr.querySelector('[data-due]').textContent = named ? withSymbol(due) : '—';
			tr.querySelector('[data-bal]').textContent = named ? withSymbol(due - paid) : '—';
		});

		state.dishes.forEach(function (d) {
			var el = document.querySelector('.dish[data-did="' + d.id + '"] [data-each]');
			if (!el) return;
			var meta = result.dishMeta[d.id];
			if (meta && meta.n && String(d.price).trim() !== '') {
				el.textContent = '→ 每人 ' + withSymbol(meta.each) + ' × ' + meta.n;
			} else {
				el.textContent = '';
			}
		});

		document.getElementById('grand-total').textContent = withSymbol(result.total);
		var real = toNum(state.realPay);
		var diffEl = document.getElementById('diff');
		if (isFinite(real)) {
			var diff = real - result.total;
			diffEl.textContent = '（' + withNega(diff) + '）';
			diffEl.className = (diff >= 0 ? 'diff-pos' : 'diff-neg') + ' hint';
		} else {
			diffEl.textContent = '';
			diffEl.className = 'hint';
		}
		save();
	}

	function fullRender() {
		document.getElementById('tax').value = state.tax;
		document.getElementById('real-pay').value = state.realPay;
		buildPeople();
		buildDishes();
		updateTotals();
	}

	document.getElementById('btn-add-person').addEventListener('click', function () {
		state.people.push({ id: uid(), name: '', paid: '' });
		fullRender();
	});

	document.getElementById('btn-add-dish').addEventListener('click', function () {
		state.dishes.push({ id: uid(), price: '', tax: true, share: [] });
		fullRender();
	});

	document.getElementById('people-body').addEventListener('input', function (e) {
		var t = e.target;
		var tr = t.closest('tr');
		if (!tr) return;
		var p = findPerson(tr.dataset.pid);
		if (!p) return;
		var k = t.getAttribute('data-k');
		if (!k) return;
		p[k] = t.value;
		if (k === 'name') {
			refreshShareLabels();
		}
		updateTotals();
	});

	document.getElementById('people-body').addEventListener('click', function (e) {
		if (!e.target.hasAttribute('data-del-person')) return;
		var tr = e.target.closest('tr');
		if (!tr || state.people.length <= 1) return;
		var id = tr.dataset.pid;
		state.people = state.people.filter(function (p) { return p.id !== id; });
		state.dishes.forEach(function (d) {
			d.share = (d.share || []).filter(function (x) { return x !== id; });
		});
		fullRender();
	});

	document.getElementById('dishes-list').addEventListener('input', function (e) {
		var t = e.target;
		var dishEl = t.closest('.dish');
		if (!dishEl) return;
		var d = findDish(dishEl.dataset.did);
		if (!d) return;
		if (t.hasAttribute('data-price')) {
			d.price = t.value;
			updateTotals();
		}
	});

	document.getElementById('dishes-list').addEventListener('change', function (e) {
		var t = e.target;
		var dishEl = t.closest('.dish');
		if (!dishEl) return;
		var d = findDish(dishEl.dataset.did);
		if (!d) return;
		if (t.hasAttribute('data-tax')) {
			d.tax = t.checked;
			updateTotals();
			return;
		}
		if (t.hasAttribute('data-share')) {
			var pid = t.getAttribute('data-pid');
			d.share = d.share || [];
			if (t.checked) {
				if (d.share.indexOf(pid) === -1) d.share.push(pid);
			} else {
				d.share = d.share.filter(function (x) { return x !== pid; });
			}
			updateTotals();
		}
	});

	document.getElementById('dishes-list').addEventListener('click', function (e) {
		if (!e.target.hasAttribute('data-del-dish')) return;
		var dishEl = e.target.closest('.dish');
		if (!dishEl) return;
		var id = dishEl.dataset.did;
		state.dishes = state.dishes.filter(function (d) { return d.id !== id; });
		fullRender();
	});

	document.getElementById('tax').addEventListener('input', function (e) {
		state.tax = e.target.value;
		updateTotals();
	});

	document.getElementById('real-pay').addEventListener('input', function (e) {
		state.realPay = e.target.value;
		updateTotals();
	});

	document.getElementById('btn-checkout').addEventListener('click', function () {
		if (!confirm('清除所有账单项，并把当前「结算」结余记入已付？')) return;
		var result = calc();
		state.people.forEach(function (p) {
			var due = result.due[p.id] || 0;
			var paid = toNum(p.paid);
			if (!isFinite(paid)) paid = 0;
			p.paid = money(paid - due);
			if (p.paid === '0.0') p.paid = '';
		});
		state.dishes = [{ id: uid(), price: '', tax: true, share: [] }];
		state.realPay = '';
		fullRender();
	});

	document.getElementById('btn-reset-balance').addEventListener('click', function () {
		if (!confirm('清除所有已付 / 结余？')) return;
		state.people.forEach(function (p) { p.paid = ''; });
		state.realPay = '';
		fullRender();
	});

	document.getElementById('btn-reset-all').addEventListener('click', function () {
		if (!confirm('清除所有记录并恢复默认？')) return;
		localStorage.removeItem(STORAGE_KEY);
		localStorage.removeItem('persons');
		localStorage.removeItem('details');
		state = defaultState();
		fullRender();
	});

	load();
	fullRender();
})();
	</script>
</body>
</html>
